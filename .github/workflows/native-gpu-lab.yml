name: Native GPU experiment
on:
  push:
    branches: [master, windows-nvgpu-lab]
  pull_request:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - shell: pwsh
        run: |
          scripts/fork/build.ps1
          experimental/windows-native-gpu/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-gpu-experiment
          path: |
            experimental/windows-native-gpu/build/native-gpu.exe
            dist/TryOmarchy-7Wdev.exe
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: |
          c++ -std=c++17 -Wall -Wextra -Werror experimental/windows-native-gpu/wire_test.cpp -o /tmp/native-wire-test
          /tmp/native-wire-test
          python3 -m unittest discover -s scripts/fork -p 'test_*.py'
