name: Shell canary

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      unfixed_palette:
        description: Revert only the Qt 6.12 palette backport to prove detection (no issue updates)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/shell-canary.yml
      - scripts/shell-canary/**
      - scripts/release/build-guest.sh
      - guest-build/**

permissions:
  contents: read

concurrency:
  group: shell-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Current packages and guest shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Export the guest builder
        run: scripts/release/build-guest.sh --source-only --output "$RUNNER_TEMP/guest-source"
      - name: Load the shell with current packages
        env:
          UNFIXED_PALETTE: ${{ inputs.unfixed_palette || false }}
        run: |
          mkdir -p canary-results
          # Use the guest's bootstrap image, then fully upgrade it. No package lock.
          image=$(awk '$1 == "FROM" {print $2; exit}' "$RUNNER_TEMP/guest-source/guest/Containerfile")
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/guest-source:/guest-source:ro" \
            -v "$GITHUB_WORKSPACE/canary-results:/results" \
            -e UNFIXED_PALETTE "$image" \
            bash /repo/scripts/shell-canary/run.sh 2>&1 | tee canary-results/setup.log
      - name: Summarize and check logs
        if: always()
        run: python3 scripts/shell-canary/check.py canary-results --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain logs and source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-canary-${{ github.run_id }}
          path: canary-results/
          retention-days: 14
          if-no-files-found: error
  alert:
    needs: probe
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request' && !inputs.unfixed_palette &&
      (needs.probe.result == 'success' || needs.probe.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: shell-canary-${{ github.run_id }}
          path: canary-results/
      - name: Update the single canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RESULT: ${{ needs.probe.result }}
        run: python3 scripts/shell-canary/alert.py canary-results
